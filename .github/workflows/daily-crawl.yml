name: Daily Tophub Crawl

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl top lists, generate insights and word clouds
        run: npm run daily
        env:
          VOLCENGINE_API_KEY: ${{ secrets.VOLCENGINE_API_KEY || secrets.ARK_API_KEY }}
          VOLCENGINE_BASE_URL: ${{ secrets.VOLCENGINE_BASE_URL || vars.VOLCENGINE_BASE_URL || secrets.ARK_BASE_URL || vars.ARK_BASE_URL || 'https://ark.cn-beijing.volces.com/api/v3' }}
          VOLCENGINE_MODEL: ${{ secrets.VOLCENGINE_MODEL || vars.VOLCENGINE_MODEL || secrets.ARK_MODEL || vars.ARK_MODEL }}
          LLM_TIMEOUT_MS: "900000"
          LLM_LIST_ITEMS_PER_SOURCE: "8"
          LLM_CATEGORY_HOT_LIMIT: "8"
          LLM_CATEGORY_SHOP_LIMIT: "8"
          WORDCLOUD_ITEMS_PER_LIST: "20"
          REQUIRE_LLM: "1"

      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily rank data"
          file_pattern: data/*.json data/insights/*.json data/wordclouds/*.json
